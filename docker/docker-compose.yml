# Развёртывание серверной части одной командой:
#   docker compose up -d --build
#
# Документооборот хранится в PostgreSQL (сервис postgres ниже).
# В томе mailsense-data остаются почтовая база SQLite, вложения, ключ шифрования и логи.
# Порт сервера публикуется на хост; порт базы наружу не выставляется.
name: mailsense
services:
  # Хранилище документооборота. Локальная почта клиента остаётся на SQLite —
  # это разные предметные области с разным жизненным циклом.
  postgres:
    image: postgres:16-alpine
    container_name: mailsense-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mailsense}
      - POSTGRES_USER=${POSTGRES_USER:-mailsense}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      # Данные базы — ОБЫЧНАЯ ПАПКА НА ХОСТЕ, а не том внутри Docker: администратору нужно
      # видеть размер, класть рядом бэкапы и уметь скопировать каталог. Путь меняется через
      # POSTGRES_DATA_PATH в .env (по умолчанию docker/pgdata).
      - ${POSTGRES_DATA_PATH:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailsense} -d ${POSTGRES_DB:-mailsense}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем: база нужна только серверу документооборота.

  mailsense:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mailsense:latest
    container_name: mailsense
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8123:8123"
    volumes:
      # Почтовая база SQLite, вложения, ключ шифрования и логи — тоже папка на хосте
      # (MAILSENSE_DATA_PATH в .env, по умолчанию docker/data). Бэкап = копирование каталога.
      - ${MAILSENSE_DATA_PATH:-./data}:/data
      # Логи контейнера не растут бесконечно: 10 МБ × 5 файлов.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # Документооборот живёт в PostgreSQL; в /data остаются почтовая база,
      # вложения, ключ шифрования и логи.
      - DOCFLOW_DATABASE_URL=postgres://${POSTGRES_USER:-mailsense}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mailsense}
      # Вход в серверную часть: кому выдать роль администратора при первом входе.
      # Без этого списка администратора в системе не будет ни у кого.
      - MAILSENSE_ADMIN_LOGINS=${MAILSENSE_ADMIN_LOGINS:-}
      # Документооборот в серверном режиме включается сам на свежей базе (иначе не работает вход,
      # а API открыт без аутентификации). =true включает его явно и записывает настройку;
      # =false (сервер только с почтой) лишь подавляет автовключение и в базу ничего не пишет.
      # Пустое значение = переменная не задана: поведение по умолчанию (автовключение).
      - MAILSENSE_DOCFLOW_ENABLED=${MAILSENSE_DOCFLOW_ENABLED:-}
      # Пароль аварийного локального администратора (вход при недоступности AD).
      - MAILSENSE_ADMIN_LOGIN=${MAILSENSE_ADMIN_LOGIN:-}
      - MAILSENSE_ADMIN_PASSWORD=${MAILSENSE_ADMIN_PASSWORD:-}
      # День предприятия для сроков и журнала (T47): «сегодня», «просрочено» и напоминания
      # считаются по этому поясу. Без TZ берётся пояс хоста — на сервере это часто UTC,
      # и тогда вчерашний срок до 03:00 МСК выглядит сегодняшним, а «просрочено» приходит позже.
      - TZ=${TZ:-Europe/Moscow}
      # ИИ-контур (внутренний, облачные провайдеры запрещены).
      # Выжимка и OCR могут быть на РАЗНЫХ серверах и с разными моделями:
      # пустая переменная = «не задано», и тогда OCR идёт на адрес и модель выжимки.
      - MAILSENSE_AI_BASE_URL=${MAILSENSE_AI_BASE_URL:-}
      - MAILSENSE_AI_MODEL=${MAILSENSE_AI_MODEL:-}
      - MAILSENSE_AI_API_KEY=${MAILSENSE_AI_API_KEY:-}
      - MAILSENSE_AI_OCR_BASE_URL=${MAILSENSE_AI_OCR_BASE_URL:-}
      - MAILSENSE_AI_OCR_MODEL=${MAILSENSE_AI_OCR_MODEL:-}
      - MAILSENSE_AI_MULTIMODAL=${MAILSENSE_AI_MULTIMODAL:-true}
      - MAILSENSE_AI_TIMEOUT_MS=${MAILSENSE_AI_TIMEOUT_MS:-120000}
      - MAILSENSE_AI_OCR_MAX_PAGES=${MAILSENSE_AI_OCR_MAX_PAGES:-10}
      - MAILSENSE_AI_TEXT_MAX_PAGES=${MAILSENSE_AI_TEXT_MAX_PAGES:-20}
      # --- Развёртывание из окружения (необязательно) ---
      # Каталог, ящики и роли служебных ящиков можно задать здесь, чтобы не заходить в интерфейс.
      # Правило: значение из окружения применяется ТОЛЬКО если настройки ещё нет в базе —
      # заданное администратором в интерфейсе всегда важнее и перезапуском не отменяется.
      #   MAILSENSE_LDAP_URL=ldaps://srv-dc01.enterprise.local:636
      #   MAILSENSE_LDAP_BASE_DN=DC=enterprise,DC=local
      # Логин и пароль каталога — это СЛУЖЕБНАЯ (bind) учётная запись, от имени которой приложение
      # читает Active Directory (поиск сотрудников для исполнителей, адресная книга), а НЕ учётки
      # работников: работники входят своими доменными учётками, и они нигде не сохраняются.
      #   MAILSENSE_LDAP_LOGIN=ldap-bind@enterprise.local
      #   MAILSENSE_LDAP_PASSWORD=…
      # Ящики — JSON-массивом (protocol: imap или pop3; tls: true/false или none/ssl/starttls):
      #   MAILSENSE_MAILBOXES=[{"username":"post@mail.test","password":"…","protocol":"imap",
      #     "host":"mail.test","port":993,"tls":true,"smtpHost":"mail.test","smtpPort":465,"smtpTls":true}]
      # Роли служебных ящиков — адресами (ищутся среди засеянных):
      #   MAILSENSE_SERVICE_MAILBOX=post@mail.test
      #   MAILSENSE_EXTERNAL_MAILBOX=info@mail.test
      - MAILSENSE_MAILBOXES=${MAILSENSE_MAILBOXES:-}
      - MAILSENSE_LDAP_URL=${MAILSENSE_LDAP_URL:-}
      - MAILSENSE_LDAP_BASE_DN=${MAILSENSE_LDAP_BASE_DN:-}
      - MAILSENSE_LDAP_LOGIN=${MAILSENSE_LDAP_LOGIN:-}
      - MAILSENSE_LDAP_PASSWORD=${MAILSENSE_LDAP_PASSWORD:-}
      - MAILSENSE_SERVICE_MAILBOX=${MAILSENSE_SERVICE_MAILBOX:-}
      - MAILSENSE_EXTERNAL_MAILBOX=${MAILSENSE_EXTERNAL_MAILBOX:-}
      # Засев ОДНОГО тестового ящика — только стенд и разработка, в проде выключено
      - MAILSENSE_SEED_ACCOUNT=${MAILSENSE_SEED_ACCOUNT:-false}
      - MAILSENSE_MAIL_USER=${MAILSENSE_MAIL_USER:-}
      - MAILSENSE_MAIL_PASS=${MAILSENSE_MAIL_PASS:-}
      - MAILSENSE_MAIL_HOST=${MAILSENSE_MAIL_HOST:-}
      - MAILSENSE_MAIL_PORT=${MAILSENSE_MAIL_PORT:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8123/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

# Сеть приложения. MTU задаётся переменной: если сервер стоит за VPN/шлюзом (в том числе
# Tailscale, «Континент TLS»), путь до контроллера домена или почтового сервера может не пропускать
# пакеты размера 1500 — соединение поднимается и тут же рвётся («read ECONNRESET» в журнале,
# при этом с хоста всё работает). Лечится уменьшением MTU, чаще всего до 1280:
#   MAILSENSE_DOCKER_MTU=1280 в .env
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: ${MAILSENSE_DOCKER_MTU:-1500}

volumes:
  mailsense-data:
    name: mailsense-data
  mailsense-pg:
    name: mailsense-pg